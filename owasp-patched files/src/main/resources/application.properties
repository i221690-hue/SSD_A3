# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# WARNING: Intentionally weak JWT secret (VULNERABILITY: API8-Weak Authentication)
app.jwt.secret=${JWT_SECRET:changeme-in-env}
# Unreasonably long token validity (VULNERABILITY: API8)
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:300}

# Expose error details (VULNERABILITY: API7-Security Misconfiguration)
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO

# JWT issuer and audience for additional validation
app.jwt.issuer=${JWT_ISSUER:owasp-lab}
app.jwt.audience=${JWT_AUD:owasp-audience}
